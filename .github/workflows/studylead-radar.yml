
name: StudyLead Radar Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: studylead-radar
  cancel-in-progress: false

jobs:
  collect-leads:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test collector
        run: python -m unittest discover -s tests -v

      - name: Collect public leads
        id: collect
        continue-on-error: true
        run: python collect_leads.py

      - name: Upload collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-report
          path: collection-report.json
          if-no-files-found: warn

      - name: Save collected leads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leads.json
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Update collected study leads"
            git push
          fi

      - name: Report collection failure
        if: always() && steps.collect.outcome != 'success'
        run: |
          echo "One or more sources failed. Inspect collection-report artifact; zero additions is not proof of success."
          exit 1
